<title>GMC-Doktor opkald</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: the app shell from the Analytics dashboard in the "Ai MERCOR" chat - collapsible sidebar (a drawer on phones),
   sticky header with page title and theme switch, KPI tiles, a chart card and table cards. The call flow keeps one store per screen. */
:root{
  --bg:#fafafa;--surface:#ffffff;--sunken:#f4f4f5;--line:#e4e4e7;--hover:#f4f4f5;
  --ink:#18181b;--ink2:#3f3f46;--muted:#71717a;
  --accent:#4f46e5;--accent-ink:#ffffff;--accent-fg:#4338ca;--accent-soft:#eef2ff;--accent-line:#c7d2fe;
  --s1:#4f46e5;--s2:#0d9488;--grid:#e4e4e7;
  --good:#047857;--good-soft:#ecfdf5;--warn:#b45309;--warn-soft:#fffbeb;--bad:#be123c;--bad-soft:#fff1f2;
  --shadow:0 1px 2px rgba(24,24,27,.06);--lift:0 12px 32px -8px rgba(24,24,27,.24);--bar:rgba(255,255,255,.84);--scrim:rgba(9,9,11,.5);
  --toast:#18181b;--toast-ink:#fafafa;--toast-link:#a5b4fc;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.32,.72,0,1);color-scheme:light}
/* Dark: the viewer's theme, unless the page's own switch (data-mode) says otherwise */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-mode="light"]){
  --bg:#09090b;--surface:#18181b;--sunken:#111113;--line:#27272a;--hover:#27272a;
  --ink:#fafafa;--ink2:#d4d4d8;--muted:#a1a1aa;
  --accent:#4f46e5;--accent-ink:#ffffff;--accent-fg:#a5b4fc;--accent-soft:rgba(99,102,241,.15);--accent-line:rgba(129,140,248,.45);
  --s1:#6366f1;--s2:#0d9488;--grid:#27272a;
  --good:#34d399;--good-soft:rgba(16,185,129,.14);--warn:#fbbf24;--warn-soft:rgba(245,158,11,.14);--bad:#fb7185;--bad-soft:rgba(244,63,94,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);--lift:0 12px 32px -8px rgba(0,0,0,.75);--bar:rgba(24,24,27,.84);--scrim:rgba(0,0,0,.6);
  --toast:#fafafa;--toast-ink:#18181b;--toast-link:#4338ca;color-scheme:dark}}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{
  --bg:#09090b;--surface:#18181b;--sunken:#111113;--line:#27272a;--hover:#27272a;
  --ink:#fafafa;--ink2:#d4d4d8;--muted:#a1a1aa;
  --accent:#4f46e5;--accent-ink:#ffffff;--accent-fg:#a5b4fc;--accent-soft:rgba(99,102,241,.15);--accent-line:rgba(129,140,248,.45);
  --s1:#6366f1;--s2:#0d9488;--grid:#27272a;
  --good:#34d399;--good-soft:rgba(16,185,129,.14);--warn:#fbbf24;--warn-soft:rgba(245,158,11,.14);--bad:#fb7185;--bad-soft:rgba(244,63,94,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);--lift:0 12px 32px -8px rgba(0,0,0,.75);--bar:rgba(24,24,27,.84);--scrim:rgba(0,0,0,.6);
  --toast:#fafafa;--toast-ink:#18181b;--toast-link:#4338ca;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button,a,summary,label{touch-action:manipulation}
a{color:var(--accent-fg);text-decoration:none}
a:hover{text-decoration:underline}
svg{flex:none}
[hidden]{display:none!important}
.btn svg,.link svg{width:18px;height:18px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.mono{font-family:var(--mono)}
p{margin:6px 0}

/* shell */
.shell{display:flex;min-height:100vh}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.side{display:none}
.brand{display:flex;align-items:center;gap:10px;height:64px;padding:0 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;min-width:0}
.brand .mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.brand .bn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navlist{list-style:none;margin:0;padding:12px;display:grid;gap:2px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:8px 12px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;text-align:left;position:relative;transition:background-color .15s,color .15s}
.navbtn:hover{background:var(--hover);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-fg)}
.navbtn svg{width:20px;height:20px}
.navbtn .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line)}
@media (min-width:1024px){
  .side{display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;width:248px;flex:none;background:var(--surface);border-right:1px solid var(--line);transition:width .2s var(--ease)}
  .shell.rail .side{width:72px}
  .shell.rail .brand{justify-content:center;padding:0}
  .shell.rail .brand .bn,.shell.rail .side .lbl{display:none}
  .shell.rail .side .navbtn{justify-content:center;padding:8px}
  .shell.rail .side .badge{position:absolute;top:2px;right:4px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .menu-btn{display:none!important}
}
.drawer{position:fixed;inset:0;z-index:40;pointer-events:none}
.drawer .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
.drawer aside{position:absolute;top:0;bottom:0;left:0;width:288px;max-width:86%;background:var(--surface);box-shadow:var(--lift);transform:translateX(-102%);transition:transform .25s var(--ease);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{pointer-events:auto}
.drawer.open .scrim{opacity:1}
.drawer.open aside{transform:none}
@media (min-width:1024px){.drawer{display:none}}
.iconbtn{width:40px;height:40px;display:inline-grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;flex:none}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 16px;background:var(--bar);-webkit-backdrop-filter:blur(12px) saturate(150%);backdrop-filter:blur(12px) saturate(150%);border-bottom:1px solid var(--line)}
.heading{flex:1;min-width:0}
.heading h1{margin:0;font-size:18px;font-weight:600;line-height:1.25;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heading p{margin:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex:none}
.theme button{width:30px;height:28px;border:0;border-radius:7px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.theme button:hover{color:var(--ink)}
.theme button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme svg{width:15px;height:15px}
@media (max-width:359px){.theme{display:none}}
.wrap{width:100%;max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:16px 140px;display:flex;flex-direction:column;gap:16px}
.wrap.narrow{max-width:760px}
#view{display:flex;flex-direction:column;gap:16px;min-width:0}
#banners{display:flex;flex-direction:column;gap:8px}
#banners:empty{display:none}
@media (min-width:640px){.top{padding-inline:24px}.wrap{padding-inline:24px;padding-block:24px 140px}}

/* notices */
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.banner::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--accent)}
.banner.warn{background:var(--warn-soft);border-color:transparent}.banner.warn::before{background:var(--warn)}
.banner.bad{background:var(--bad-soft);border-color:transparent}.banner.bad::before{background:var(--bad)}
.banner.good{background:var(--good-soft);border-color:transparent}.banner.good::before{background:var(--good)}
.banner .link{padding:0 0 0 4px;font-size:14px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0 0 4px;font-size:16px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.card h3{margin:0 0 8px;font-size:15px;font-weight:600}
.sec{display:flex;align-items:center;gap:8px;margin:8px 2px -4px;font-size:15px;font-weight:600}
.sec .badge{background:var(--sunken);color:var(--ink2)}
.kh{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* overview */
.kpis{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:1100px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{padding:16px 18px}
.kpi .kl{font-size:13px;font-weight:500;color:var(--muted)}
.ico{width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.ico svg{width:16px;height:16px}
.kpi .kv{margin-top:10px;font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .kv small{font-size:14px;font-weight:500;color:var(--muted);margin-left:2px;letter-spacing:0}
.kpi .kd{margin-top:6px;font-size:12.5px;color:var(--muted)}
.kpi .up{color:var(--good);font-weight:600}
.meter{height:4px;border-radius:2px;background:var(--sunken);margin-top:12px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .5s var(--ease)}
@media (max-width:420px){.kpis{gap:10px}.kpi{padding:14px}.kpi .kv{font-size:22px}.ico{width:28px;height:28px}}
.duo{display:grid;gap:16px}
@media (min-width:1024px){.duo{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 16px;flex-wrap:wrap}
.total{font-size:13.5px;color:var(--muted)}
.total b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.keys{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.key{display:inline-flex;align-items:center;gap:6px}
.key i{width:10px;height:10px;border-radius:3px;display:inline-block}
.key i.goal{width:16px;height:0;border-top:2px dashed var(--muted);border-radius:0}
.chart{position:relative;margin-top:6px;min-height:220px;max-width:100%}
.chart svg{display:block}
.chart text{fill:var(--muted);font:11.5px var(--sans)}
.chart text.today{fill:var(--ink);font-weight:600}
.chart text.empty{fill:var(--muted);font-size:13px}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.chart .goal{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.chart .b1{fill:var(--s1)}
.chart .b2{fill:var(--s2)}
.chart .hov{fill:var(--sunken)}
.tip{position:absolute;top:0;left:0;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--lift);padding:8px 10px;font-size:12.5px;white-space:nowrap;z-index:2}
.tip b{display:block;margin-bottom:2px}
.tip span{display:flex;align-items:center;gap:6px}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.next .shopname{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:10px 0 0;word-break:break-word}
.next .phone-s{font-family:var(--mono);font-size:15px;color:var(--ink2);margin:2px 0 0}
.checklist{list-style:none;margin:12px 0 0;padding:0}
.checklist li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.checklist li:first-child{border-top:0;padding-top:4px}
.checklist .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;color:var(--good)}
.checklist li.ok .tick{background:var(--good-soft);border-color:transparent}
.checklist .txt{flex:1;min-width:0}
.checklist li.ok b{color:var(--muted)}
.checklist small{display:block;color:var(--muted);font-size:12.5px;word-break:break-word}
.checklist .btn{flex:none}
.plan{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.plan li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:start}
.plan .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;border:2px solid var(--line);background:var(--surface)}
.plan .now .dot{border-color:var(--accent);background:var(--accent)}
.plan .done .dot{border-color:var(--accent);background:var(--accent-soft)}
.plan b{font-weight:600}
.plan small{display:block;color:var(--muted);font-size:12.5px}
.tbl-wrap{overflow-x:auto;margin:14px -20px -20px;border-top:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 20px;background:var(--sunken);white-space:nowrap}
.tbl td{padding:12px 20px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:first-child td{border-top:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .sub{display:block;font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.rowlink{background:none;border:0;padding:0;font-weight:500;color:var(--ink);cursor:pointer;text-align:left;word-break:break-word}
.rowlink:hover{color:var(--accent-fg);text-decoration:underline}

/* pills: state in form as well as in words */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--ink2);white-space:nowrap}
.st-ja,.st-rettet,.r-ja,.pill.g{background:var(--good-soft);color:var(--good)}
.st-nej,.st-forkert,.st-opgivet,.r-nej,.r-forkert,.pill.b{background:var(--bad-soft);color:var(--bad)}
.st-ring_senere,.st-intet_svar,.r-ring_senere,.r-intet_svar,.pill.w,.prac-flag{background:var(--warn-soft);color:var(--warn)}
.r-bestilt,.pill.a{background:var(--accent-soft);color:var(--accent-fg)}
.qcount{font-size:12.5px;color:var(--muted)}

/* the call: one store, what to say, big answer buttons */
.call{border-radius:14px}
.call,#view{scroll-margin-top:80px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.shop{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:10px 0 0;word-break:break-word}
.card .shop.sm,.shop.sm{font-size:17px;margin:0}
.steps-nav{display:flex;gap:6px;margin:14px 0 2px}
.steps-nav span{flex:1;font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.steps-nav span::before{content:"";display:block;height:4px;border-radius:2px;background:var(--sunken);margin-bottom:5px;transition:background-color .3s var(--ease)}
.steps-nav span.done::before{background:var(--accent-line)}
.steps-nav span.now{color:var(--accent-fg)}
.steps-nav span.now::before{background:var(--accent)}
.info{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--sunken)}
.info .facts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.info .fact{font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.info p{margin:4px 0 0;font-size:14px}
.info .om{color:var(--muted);font-size:13.5px}
.phone{display:flex;flex-direction:column;align-items:center;gap:12px;margin:14px 0 4px;padding:18px 16px;border-radius:12px;border:1px dashed var(--line)}
.phone .num{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all;line-height:1.2}
.phone .row{justify-content:center;margin:0}
.tel{font-size:14px;color:var(--muted);margin:6px 0 0;font-family:var(--mono)}
.note,.hint-set{background:var(--warn-soft);border-radius:10px;padding:10px 14px;margin:12px 0 0;font-size:14px}
.thread{margin-top:4px}
.who{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:18px 2px 8px}
.say{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--ink);border-radius:12px;padding:14px 16px;font-size:19px;line-height:1.45;font-weight:500;letter-spacing:-.01em}
.say b{font-weight:700;color:var(--accent-fg)}
.say.sm{font-size:16px}
mark{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 4px;font-weight:700}
.replies{display:grid;gap:8px}
.reply{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-size:16px;font-weight:500;line-height:1.35;cursor:pointer;transition:transform .1s ease-out,border-color .15s,background-color .15s}
.reply::after{content:"→";color:var(--muted);flex:none}
.reply:hover{border-color:var(--accent-line);background:var(--hover)}
.reply:active{transform:scale(.985)}
.reply.pos{border-color:var(--accent-line);box-shadow:inset 0 0 0 1px var(--accent-line)}
.reply.pos::after{color:var(--accent-fg)}
.reply.neg{color:var(--bad)}
.reply.d{font-style:italic}
.reply:disabled{opacity:.4}
.sys{text-align:center;font-size:13.5px;color:var(--muted);margin:14px 12px}
/* practice: what the pretend customer says, and the answer that fits */
.cust{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0}
.cust .av{width:30px;height:30px;border-radius:50%;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}
.cust .bub{background:var(--sunken);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:9px 14px;font-size:16px;min-width:0}
.cust .bub small{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hint{outline:2px dashed var(--warn);outline-offset:2px}
/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0}
.rowbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:50px;padding:11px 14px;border:0;background:transparent;text-align:left;font-size:15.5px;font-weight:500;cursor:pointer;transition:background-color .15s}
.rowbtn+.rowbtn{border-top:1px solid var(--line)}
.rowbtn::after{content:"→";color:var(--muted);flex:none}
.rowbtn:hover,.rowbtn:active{background:var(--hover)}
.rowbtn.primary{color:var(--accent-fg);font-weight:600}
.rowbtn.primary::after{color:var(--accent-fg)}
.rowbtn.neg{color:var(--bad)}
.rowbtn small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:400}
.rowbtn:disabled{opacity:.4}
.list .rowbtn.hint{outline-offset:-3px}
details{margin:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:14.5px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}

// ----- Kalender: everything that has a time, like a calendar list (calls, retries, mails, follow-ups) -----
function agenda() {
  const now = new Date(), items = [];
  for (const [id, s] of stores) {
    const x = stOf(s);
    if (s.kontakt && !s.mail_sendt) items.push({t: s.kontakt.t || nowIso(), kind: 'mail', id, s});
    if (x === 'ring_senere' && s.ring_igen) items.push({t: s.ring_igen, kind: 'call', id, s});
    if (x === 'intet_svar' && s.ring_igen) items.push({t: s.ring_igen, kind: 'retry', id, s});
    if (x === 'ja' && s.kontakt && s.kontakt.opfoelgning && s.mail_sendt && !s.opfoelg_sendt && !s.ordre) {
      const r = new Date(s.mail_sendt); r.setDate(r.getDate() + 2); r.setHours(10, 0, 0, 0);
      items.push({t: r.toISOString(), kind: 'fu', id, s});
    }
  }
  items.sort((a, b) => (a.kind === 'mail' ? 0 : new Date(a.t)) - (b.kind === 'mail' ? 0 : new Date(b.t))); // unsent mails first
  const groups = new Map();
  for (const it of items) {
    const d = new Date(it.t), due = it.kind === 'mail' || d <= now;
    const key = due ? 'nu' : d.toDateString();
    if (!groups.has(key)) groups.set(key, {due, day: d, items: []});
    groups.get(key).items.push(it);
  }
  return [...groups.values()].sort((a, b) => (b.due - a.due) || a.day - b.day);

// ---------- writes ----------
function busy(on) { ui.saving = on; document.body.classList.toggle('busy', on); }
async function withRetry(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 800)); return fn(); }
    throw e;
  }
}
function errMsg(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') { if (canWrite !== true) canWrite = false; return 'Kunne ikke gemme. Har du kun adgang til at se siden?'; }
  if (c === 'quota_exceeded') return 'Databasen er fuld. Skriv til Claude.';
  if (c === 'revoked') return 'Adgangen er ændret. Genindlæs siden.';
  if (c === 'resource_exhausted') return 'For mange gem på kort tid. Vent et øjeblik, og prøv igen.';
  return 'Kunne ikke gemme. Tjek internettet, og prøv igen.';
}
async function write(id, fields) {
  if (!db || ui.saving) return false;
  busy(true);
  try {
    await withRetry(() => db.collection('stores').doc(id).update(fields));
    stores.set(id, {...(stores.get(id) || {}), ...fields}); // show it at once; the live snapshot confirms it
    try { if (navigator.vibrate) navigator.vibrate(10); } catch (e) { /* no haptics here */ }
    return true;
  } catch (e) { toast(errMsg(e)); return false; }
  finally { busy(false); render(); }
}
function restoreValue(prev, cur) {
  if (prev && typeof prev === 'object' && !Array.isArray(prev) && cur && typeof cur === 'object' && !Array.isArray(cur)) {
    const out = {...prev};
    for (const k of Object.keys(cur)) if (!(k in prev)) out[k] = null;
    return out;
  }
  return prev === undefined ? null : prev;
}
async function act(id, fields, msg, opts = {}) {
  const before = stores.get(id) || {}, prev = {};
  for (const k of Object.keys(fields)) prev[k] = restoreValue(before[k], fields[k]);
  const ok = await write(id, fields);
  if (ok && msg) toast(msg, {...opts, undo: {id, prev, ring: !!opts.ring}});
  return ok;
}
function resetCall() { ui.current = null; ui.forced = null; ui.step = 'start'; ui.hist = []; ui.form = {}; ui.err = ''; ui.anim = 'up'; }
function toCard() { requestAnimationFrame(() => { const el = document.querySelector('.card.call') || $('#view'); if (el) el.scrollIntoView({block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }); }

async function outcome(kind, grund) {
  if (ui.tab === 'ovelse') return pracEnd({kind, grund}); // practice: nothing is saved
  const id = currentId();
  if (!id) return;
  const s = stores.get(id) || {}, f = {log: [...(s.log || []), {t: nowIso(), r: kind}]};
  if (kind === 'nej' && grund) f.grund = grund;
  if (kind === 'intet_svar') {
    if (tries(s) + 1 >= 3) { f.status = 'opgivet'; f.ring_igen = null; }
    else { f.status = 'intet_svar'; f.ring_igen = callSlot(new Date(Date.now() + 2 * 3600e3)).toISOString(); }
  } else { f.status = kind; f.ring_igen = null; }
  const label = kind === 'intet_svar' ? (f.status === 'opgivet' ? 'intet svar 3 gange, droppet' : `intet svar, ringer igen ${fmtDT(f.ring_igen)}`) : kind === 'nej' ? 'nej tak' : 'forkert nummer';
  const ok = await act(id, f, `${s.butik}: ${label}. Næste butik er klar.`, {ring: true});

async function copyText(txt) {

  try {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}

  switch (a) {
    case 'o': outcome(k); break;
    case 'go': if (b.dataset.p) ui.form.produkt = b.dataset.p; ui.hist.push(ui.step); ui.step = k; ui.err = ''; ui.anim = 'fwd'; ui.formRev++; render(); toCard(); break;
    case 'back': ui.step = ui.hist.pop() || 'start'; ui.err = ''; ui.anim = 'back'; ui.formRev++; render(); toCard(); break;
    case 'restart': ui.step = 'start'; ui.hist = []; ui.form = {}; ui.err = ''; ui.anim = 'back'; ui.formRev++; render(); toCard(); break;
    case 'set': { const v = b.dataset.v; ui.form[b.dataset.f] = v === '1' ? true : v === '0' ? false : v; ui.formRev++; render(); break; }
    case 'nejg': outcome('nej', b.dataset.v === 'Ved ikke' ? '' : b.dataset.v); break;
    case 'fill': ui.form[b.dataset.f] = b.dataset.v; ui.formRev++; render(); break;
    case 'saveja': saveJa(); break;
    case 'later': saveLater(k); break;
    case 'skip': { const cur = currentId(); if (cur) ui.skipped.add(cur); resetCall(); render(); toCard(); toast('Sprunget over. Butikken kommer igen, når du genindlæser siden.'); break; }
    case 'unskip': ui.skipped.clear(); render(); break;
    case 'next': ui.done = null; ui.anim = 'up'; render(); toCard(); break;
    case 'sent': markSent(id, k); break;
    case 'openmail': { ui.openMail = ui.openMail === k ? null : k; render();
      const sid = k.slice(k.indexOf(':') + 1), s = stores.get(sid);
      if (ui.openMail && s) { const mk = k.startsWith('fu:') ? 'opfoelg' : s.ordre ? 'ordre' : 'rapport'; if (!drafts.has(`${mk}:${sid}`)) writeDraft(sid, mk); }
      break; }
    case 'undo': undo(); break;
    case 'callnow': go('ring'); resetCall(); ui.forced = id; ui.current = id; ui.done = null; render(); toCard(); break;
    case 'bestilt': { const s = stores.get(id); if (!s) break; const p = k === 'audit' ? 'audit' : 'rettelse';
      act(id, {ordre: {produkt: p, pris: PRIS[p], trin: 'bestilt', t_bestilt: nowIso(), mail_sendt: null, fakturanr: null}}, `${s.butik} har bestilt! Se fanen Kunder.`).then(ok => { if (ok) { ui.tab = 'kunder'; render(); } }); break; }
    case 'nejtak': { const s = stores.get(id); if (s) act(id, {status: 'nej', grund: 'Nej efter rapporten'}, `${s.butik}: nej tak`); break; }
    case 'trin': { const s = stores.get(id); if (s && s.ordre) act(id, {ordre: {...s.ordre, trin: k, ['t_' + k]: nowIso()}}, `${s.butik}: ${TRIN_LABEL[k].toLowerCase()}`); break; }
    case 'faktura': { const s = stores.get(id); if (s && s.ordre) act(id, {ordre: {...s.ordre, fakturanr: nextInvoiceNo(), faktura_dato: nowIso()}}, 'Fakturaen er lavet'); break; }
    case 'savenote': { const el = document.querySelector(`[data-note="${CSS.escape(id)}"]`); if (el) act(id, {note: el.value.trim()}, 'Noten er gemt'); break; }
    case 'reset': { const s = stores.get(id); if (s) act(id, {status: 'ny', ring_igen: null, kontakt: null, ordre: null, mail_sendt: null, opfoelg_sendt: null}, `${s.butik} er nulstillet`); break; }
    case 'hidehelp': lsSet('gmcd-help', '1'); ui.helpHidden = true; render(); break;
    case 'savesettings': saveSettings(); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.f) {
    ui.form[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.f === 'mail') { const good = MAIL_RE.test(el.value.trim()); el.classList.toggle('ok', good); if (good) el.classList.remove('bad'); }
  } else if (el.id === 'q') { ui.q = el.value; ui.open = null; render(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.f && (el.type === 'checkbox' || el.type === 'radio')) ui.form[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset && el.dataset.f === 'mail') el.classList.toggle('bad', !!el.value.trim() && !MAIL_RE.test(el.value.trim())); // validate inline, when they leave the field
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.dataset && d.dataset.d) { if (d.open) ui.openD.add(d.dataset.d); else ui.openD.delete(d.dataset.d); }
}, true);
addEventListener('keydown', e => { if (e.key === 'Escape' && ui.menu) { ui.menu = false; render(); $('#menubtn').focus(); } });
let resizeRaf = 0;
addEventListener('resize', () => { cancelAnimationFrame(resizeRaf); resizeRaf = requestAnimationFrame(() => { if (ui.tab === 'overblik' && loaded) drawChart(dayStats()); if (ui.menu && innerWidth >= 1024) { ui.menu = false; render(); } }); });

// ---------- boot ----------
async function boot() {
  applyTheme();
  $('#searchbar').insertAdjacentHTML('afterbegin', ic('search'));
  render();
  const C = window.claude;
  if (!C || typeof C.use !== 'function') { conn = 'missing'; return render(); }
  try { db = await C.use('db'); } catch (e) { db = null; }
  if (!db) { conn = 'missing'; return render(); }
  conn = 'ok';
  C.use('mcp').then(m => { mcp = m || null; render(); if (mcp) { checkHenv(); setInterval(() => { if (document.visibilityState === 'visible') checkHenv(); }, 10 * 60e3); } }).catch(() => {});
  C.use('sample').then(f => { samp = f || null; render(); }).catch(() => {});
  C.use('user').then(u => u ? u.can('data.write') : null).then(v => { if (v === true || v === false) { canWrite = v; render(); } }).catch(() => {});
  db.collection('stores').limit(1000).onSnapshot(snap => {
    stores.clear();
    for (const d of snap.docs) stores.set(d.id, d.data());
    loaded = true;
    render();
  }, () => { conn = 'error'; render(); });
  db.doc('settings/main').onSnapshot(snap => { settings = snap.exists ? snap.data() : {}; render(); }, () => {});
  db.collection('henv').onSnapshot(snap => { henvDone = {}; for (const d of snap.docs) henvDone[d.id] = d.data(); render(); }, () => {});
  db.doc('meta/tjek').onSnapshot(snap => { tjek = snap.exists ? snap.data() : null; render(); }, () => {});
  setInterval(render, 60000);
}
boot();
})();
</script>
